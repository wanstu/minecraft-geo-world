<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GeoWorld Tester</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <div>
    <strong>GeoWorld Tester</strong>
    <span class="muted">真实 Generator / Runtime 测试工具</span>
  </div>
  <div class="header-status">
    <div id="backendStatus" class="pill">后端检查中</div>
    <div id="topStatus" class="pill">未生成</div>
  </div>
</header>
<div class="layout">
  <aside class="panel controls">
    <h2>世界参数</h2>
    <label>Seed
      <div class="seed-control">
        <input id="seed" type="number" value="731894205">
        <button id="randomSeed" type="button">随机</button>
      </div>
    </label>
    <div class="two">
      <label>网格宽<input id="width" type="number" value="320" min="16" max="1024"></label>
      <label>网格高<input id="height" type="number" value="200" min="16" max="1024"></label>
    </div>
    <label>采样间距
      <select id="cellSize">
        <option value="128">128 方块 / 点（标准，范围更大）</option>
        <option value="64">64 方块 / 点（更细，范围减半）</option>
      </select>
    </label>
    <div id="rangePreview" class="muted small"></div>
    <div class="two">
      <label>板块数<input id="plates" type="number" value="18" min="2"></label>
      <label>洋壳比例<input id="ocean" type="number" value="0.68" min="0.1" max="0.9" step="0.01"></label>
    </div>
    <div class="muted small parameter-help">洋壳比例控制地壳分类，不等于最终海水覆盖率。</div>
    <label class="range-label">大陆破碎度 <b id="fragmentationValue">0.35</b>
      <input id="fragmentation" type="range" min="0.05" max="1" step="0.05" value="0.35">
    </label>
    <div class="muted small parameter-help">低值偏完整大陆；高值会增加半岛、海峡、岛链和次级陆块。</div>
    <label class="range-label">大陆平均分离度 <b id="separationValue">0.65</b>
      <input id="separation" type="range" min="0.05" max="1" step="0.05" value="0.65">
    </label>
    <div class="muted small parameter-help">低值更容易形成超级大陆；高值会让各大陆核保持更大间距。</div>
    <button id="generate" class="primary">生成世界</button>
    <div class="progress"><i id="progressBar"></i></div>
    <div id="progressText" class="muted small">默认参数适合快速检查世界结构</div>

    <hr>
    <h2>模型</h2>
    <label>保存名称<input id="modelName" placeholder="生成后自动填写"></label>
    <button id="save" disabled>保存 / 更新模型</button>
    <label>已保存模型<select id="models"><option value="">暂无</option></select></label>
    <button id="load" disabled>重新打开模型</button>
    <div id="modelMessage" class="muted small"></div>

    <hr>
    <h2>当前世界</h2>
    <div id="stats" class="kv"><span>Seed</span><b>—</b></div>
  </aside>

  <main class="map-area">
    <div class="toolbar">
      <button class="layer active" data-layer="final">最终地形</button>
      <button class="layer" data-layer="water">水体</button>
      <button class="layer" data-layer="biome">群系</button>
      <button class="layer" data-layer="profile">配置置信度</button>
      <span class="muted small">点击地图查看该坐标的最终结果</span>
    </div>
    <div id="mapWrap" class="map-wrap empty">
      <img id="map" alt="GeoWorld map">
      <div id="emptyHint">设置参数后点击“生成世界”</div>
      <div id="mapNotice" class="map-notice" hidden></div>
      <div id="cursor"></div>
    </div>
    <div class="footnote">这里显示的是最终 Runtime 结果；生成失败时不会把旧地图冒充成新结果。</div>
  </main>

  <aside class="panel inspector">
    <h2>坐标检查</h2>
    <div id="sampleEmpty" class="muted">点击地图中的任意位置。</div>
    <div id="sample" hidden></div>
  </aside>
</div>
<script src="/app.js"></script>
</body>
</html>
