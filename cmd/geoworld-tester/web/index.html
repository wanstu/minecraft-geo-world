<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GeoWorld Tester</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <div>
    <strong>GeoWorld Tester</strong>
    <span class="muted">真实 Generator / Runtime 测试工具</span>
  </div>
  <div id="topStatus" class="pill">未生成</div>
</header>
<div class="layout">
  <aside class="panel controls">
    <h2>世界参数</h2>
    <label>Seed<input id="seed" type="number" value="731894205"></label>
    <div class="two">
      <label>网格宽<input id="width" type="number" value="320" min="16" max="1024"></label>
      <label>网格高<input id="height" type="number" value="200" min="16" max="1024"></label>
    </div>
    <label>精度
      <select id="cellSize">
        <option value="128">128 blocks / node（标准）</option>
        <option value="64">64 blocks / node（高精度）</option>
      </select>
    </label>
    <div class="two">
      <label>板块数<input id="plates" type="number" value="18" min="2"></label>
      <label>海洋比例<input id="ocean" type="number" value="0.68" min="0.1" max="0.9" step="0.01"></label>
    </div>
    <button id="generate" class="primary">生成世界</button>
    <div class="progress"><i id="progressBar"></i></div>
    <div id="progressText" class="muted small">默认 320×200，适合快速测试</div>

    <hr>
    <h2>模型</h2>
    <label>保存名称<input id="modelName" placeholder="seed-731894205"></label>
    <button id="save">保存 / 更新模型</button>
    <label>已保存模型<select id="models"><option value="">暂无</option></select></label>
    <button id="load">重新打开模型</button>
    <div id="modelMessage" class="muted small"></div>

    <hr>
    <h2>当前世界</h2>
    <div id="stats" class="kv"><span>Seed</span><b>—</b></div>
  </aside>

  <main class="map-area">
    <div class="toolbar">
      <button class="layer active" data-layer="final">最终地形</button>
      <button class="layer" data-layer="water">水体</button>
      <button class="layer" data-layer="biome">群系</button>
      <button class="layer" data-layer="profile">Profile 置信度</button>
      <span class="muted small">点击地图查看真实 Runtime 采样</span>
    </div>
    <div id="mapWrap" class="map-wrap empty">
      <img id="map" alt="GeoWorld map">
      <div id="emptyHint">设置参数后点击“生成世界”</div>
      <div id="cursor"></div>
    </div>
    <div class="footnote">这不是静态原型：地图来自当前 <code>GenerateWorld → CoastTerrain → Waterbed → WorldSample → RuntimeProfile</code>。</div>
  </main>

  <aside class="panel inspector">
    <h2>坐标检查</h2>
    <div id="sampleEmpty" class="muted">点击地图中的任意位置。</div>
    <div id="sample" hidden></div>
  </aside>
</div>
<script src="/app.js"></script>
</body>
</html>
