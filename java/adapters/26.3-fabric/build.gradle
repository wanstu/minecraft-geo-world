plugins {
    id 'net.fabricmc.fabric-loom' version '1.18-SNAPSHOT'
    id 'java'
}

group = 'geoworld.fabric'
version = project.mod_version

repositories {
    maven { url 'https://maven.fabricmc.net/' }
    mavenCentral()
}

dependencies {
    minecraft 'com.mojang:minecraft:' + project.minecraft_version
    implementation 'net.fabricmc:fabric-loader:' + project.loader_version
    implementation 'net.fabricmc.fabric-api:fabric-api:' + project.fabric_api_version
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
base.archivesName = 'geoworld'

tasks.named('processResources', ProcessResources) {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand(version: project.version)
    }
}

// Minecraft 26.3 implementation shared by NeoForge and Fabric.
sourceSets.main.java.srcDir '../../runtime-reader/src/main/java'
sourceSets.main.java.srcDir '../../minecraft-common/src/main/java'
sourceSets.main.java.srcDir '../../minecraft-v26-common/src/main/java'
sourceSets.main.java.srcDir '../../minecraft-v26_3-common/src/main/java'

sourceSets.main.resources.srcDir '../../minecraft-v26-common/src/main/resources'
sourceSets.main.resources.srcDir '../../../acceptance/resources'

// Shared Minecraft 26.3 assets/data are loader-neutral.
sourceSets.main.resources.srcDir '../../minecraft-v26_3-common/src/main/resources'

def geoWorldEngineResources = layout.buildDirectory.dir('generated/geoworldEngineResources')
def geoWorldEnginePlatforms = [
    'windows-x64'  : ['windows', 'amd64', 'geoworld-engine.exe'],
    'windows-arm64': ['windows', 'arm64', 'geoworld-engine.exe'],
    'linux-x64'    : ['linux', 'amd64', 'geoworld-engine'],
    'linux-arm64'  : ['linux', 'arm64', 'geoworld-engine'],
    'macos-x64'    : ['darwin', 'amd64', 'geoworld-engine'],
    'macos-arm64'  : ['darwin', 'arm64', 'geoworld-engine']
]
def geoWorldEngineBuilds = geoWorldEnginePlatforms.collect { target, spec ->
    tasks.register('buildGeoWorldEngine_' + target.replace('-', '_'), Exec) {
        group = 'build'
        description = "Cross-compiles GeoWorld engine for ${target}."
        workingDir file('../../..')
        inputs.files(fileTree('../../..') {
            include 'go.mod'
            include 'go.sum'
            include 'cmd/geoworld-engine/**/*.go'
            include 'internal/**/*.go'
        })
        def output = geoWorldEngineResources.map {
            it.file("native/${target}/${spec[2]}")
        }
        outputs.file output
        environment 'GOOS', spec[0]
        environment 'GOARCH', spec[1]
        environment 'CGO_ENABLED', '0'
        doFirst {
            output.get().asFile.parentFile.mkdirs()
            commandLine 'go', 'build', '-trimpath', '-ldflags=-s -w',
                '-o', output.get().asFile.absolutePath,
                './cmd/geoworld-engine'
        }
    }
}
sourceSets.main.resources.srcDir geoWorldEngineResources
tasks.named('processResources').configure {
    dependsOn geoWorldEngineBuilds
}

def geoWorldToolResources = layout.buildDirectory.dir('generated/geoworldToolResources')
def geoWorldToolPlatforms = [
    'windows-x64'  : ['windows', 'amd64', 'geoworld-tool.exe'],
    'windows-arm64': ['windows', 'arm64', 'geoworld-tool.exe'],
    'linux-x64'    : ['linux', 'amd64', 'geoworld-tool'],
    'linux-arm64'  : ['linux', 'arm64', 'geoworld-tool'],
    'macos-x64'    : ['darwin', 'amd64', 'geoworld-tool'],
    'macos-arm64'  : ['darwin', 'arm64', 'geoworld-tool']
]
def geoWorldToolBuilds = geoWorldToolPlatforms.collect { target, spec ->
    tasks.register('buildGeoWorldTool_' + target.replace('-', '_'), Exec) {
        group = 'build'
        description = "Cross-compiles GeoWorld Web Tool for ${target}."
        workingDir file('../../..')
        inputs.files(fileTree('../../..') {
            include 'go.mod'
            include 'go.sum'
            include 'acceptance/**/*.go'
            include 'acceptance/resources/**'
            include 'cmd/geoworld-tester/**/*.go'
            include 'cmd/geoworld-tester/web/**'
            include 'internal/**/*.go'
        })
        def output = geoWorldToolResources.map {
            it.file("geoworld/tool/native/${target}/${spec[2]}")
        }
        outputs.file output
        environment 'GOOS', spec[0]
        environment 'GOARCH', spec[1]
        environment 'CGO_ENABLED', '0'
        doFirst {
            output.get().asFile.parentFile.mkdirs()
            commandLine 'go', 'build', '-trimpath', '-ldflags=-s -w',
                '-o', output.get().asFile.absolutePath,
                './cmd/geoworld-tester'
        }
    }
}
sourceSets.main.resources.srcDir geoWorldToolResources
tasks.named('processResources').configure {
    dependsOn geoWorldToolBuilds
}
tasks.named('jar', Jar).configure {
    manifest {
        attributes('Main-Class': 'geoworld.minecraft.common.tool.GeoWorldToolLauncher')
    }
}

tasks.register('verifyGeoWorldAdapter') {
    group = 'verification'
    dependsOn tasks.named('classes')
    doLast {
        def adapter = layout.buildDirectory.file(
            'classes/java/main/geoworld/fabric/GeoWorldFabricPlatform.class'
        ).get().asFile
        if (!adapter.isFile()) {
            throw new GradleException(
                'Fabric platform adapter did not compile: ' + adapter
            )
        }
    }
}
tasks.register('verifyGeoWorldModelQuery', JavaExec) {
    group = 'verification'
    description = 'Runs black-box World Model/API acceptance checks against the locked v1.1 golden model.'
    dependsOn tasks.named('compileJava')
    classpath = sourceSets.main.output.classesDirs
    mainClass = 'geoworld.runtime.GeoWorldModelVerifier'
    args file('../../../internal/goldenvectors/testdata/runtime-v1.geoworld').absolutePath
}

tasks.register('verifyGeoWorldEngineBridge', JavaExec) {
    group = 'verification'
    description = 'Generates a fresh model through the embedded engine and verifies locked profile/rules/model identity.'
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.output.classesDirs + files(sourceSets.main.output.resourcesDir) + sourceSets.main.compileClasspath
    mainClass = 'geoworld.minecraft.common.verification.GeoWorldEngineBridgeVerifier'
    systemProperty 'geoworld.engine.embeddedOnly', 'true'
    systemProperty 'geoworld.cache.dir', layout.buildDirectory.dir('engine-bridge-verifier-cache').get().asFile.absolutePath
    doFirst {
        delete layout.buildDirectory.dir('engine-bridge-verifier-cache')
    }
}

tasks.register('verifyGeoWorldParameterEffects', JavaExec) {
    group = 'verification'
    description = 'Verifies PARAM-03 by generating same-Seed high/low parameter models through the embedded engine.'
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.output.classesDirs + files(sourceSets.main.output.resourcesDir) + sourceSets.main.compileClasspath
    mainClass = 'geoworld.minecraft.common.verification.GeoWorldParameterEffectsVerifier'
    systemProperty 'geoworld.engine.embeddedOnly', 'true'
    systemProperty 'geoworld.cache.dir', layout.buildDirectory.dir('parameter-effects-verifier-cache').get().asFile.absolutePath
    doFirst {
        delete layout.buildDirectory.dir('parameter-effects-verifier-cache')
    }
}

tasks.register('verifyGeoWorldCreationConfig', JavaExec) {
    group = 'verification'
    description = 'Verifies semantic parameter defaults, localization, warnings, snapshots, preset bundles, and delegates PARAM-03 to world-output verification.'
    dependsOn tasks.named('compileJava')
    dependsOn tasks.named('verifyGeoWorldParameterEffects')
    classpath = sourceSets.main.output.classesDirs + sourceSets.main.compileClasspath + files('../../minecraft-v26-common/src/main/resources')
    mainClass = 'geoworld.minecraft.common.creation.GeoWorldCreationConfigVerifier'
}

tasks.register('verifyGeoWorldPreviewModel', JavaExec) {
    group = 'verification'
    description = 'Verifies PROFILE-03: preview reads the exact locked World Model and profile.'
    dependsOn tasks.named('compileJava')
    classpath = sourceSets.main.output.classesDirs
    mainClass = 'geoworld.minecraft.common.preview.GeoWorldPreviewModelVerifier'
    args file('../../../internal/goldenvectors/testdata/runtime-v1.geoworld').absolutePath
}

tasks.register('verifyGeoWorldSpawn', JavaExec) {
    group = 'verification'
    description = 'Verifies SPAWN-01/02/03: parameterized deterministic habitable-mainland spawn selection.'
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.output.classesDirs + files(sourceSets.main.output.resourcesDir) + sourceSets.main.compileClasspath
    mainClass = 'geoworld.minecraft.v26_3common.worldgen.GeoWorldSpawnVerifier'
    systemProperty 'geoworld.engine.embeddedOnly', 'true'
}

tasks.register('verifyGeoWorldShoreline', JavaExec) {
    group = 'verification'
    description = 'Runs 26.3 shoreline and riverbank regression checks, including reported real-world coordinates.'
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.output.classesDirs + files(sourceSets.main.output.resourcesDir) + sourceSets.main.compileClasspath
    mainClass = 'geoworld.minecraft.v26_3common.worldgen.GeoWorldShorelineVerifier'
    systemProperty 'geoworld.engine.embeddedOnly', 'true'
}

tasks.register('verifyGeoWorldSurfaceBiome', JavaExec) {
    group = 'verification'
    description = 'Runs 26.3 final biome/surface material regression checks.'
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.output.classesDirs + files(sourceSets.main.output.resourcesDir) + sourceSets.main.compileClasspath
    mainClass = 'geoworld.minecraft.v26_3common.worldgen.GeoWorldSurfaceBiomeVerifier'
    systemProperty 'geoworld.engine.embeddedOnly', 'true'
}

tasks.register('fingerprintGeoWorldBiomeDecisions', JavaExec) {
    group = 'verification'
    description = 'Verifies the locked 26.3 3D biome-decision fingerprints for current generation rules.'
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.output.classesDirs + files(sourceSets.main.output.resourcesDir) + sourceSets.main.compileClasspath
    mainClass = 'geoworld.minecraft.v26_3common.worldgen.GeoWorldBiomeDecisionFingerprint'
    systemProperty 'geoworld.engine.embeddedOnly', 'true'
    if (project.hasProperty('geoWorldFingerprintSeed')) {
        args project.property('geoWorldFingerprintSeed').toString()
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyGeoWorldAdapter')
    dependsOn tasks.named('verifyGeoWorldEngineBridge')
    dependsOn tasks.named('verifyGeoWorldModelQuery')
    dependsOn tasks.named('verifyGeoWorldCreationConfig')
    dependsOn tasks.named('verifyGeoWorldPreviewModel')
    dependsOn tasks.named('verifyGeoWorldSpawn')
    dependsOn tasks.named('verifyGeoWorldShoreline')
    dependsOn tasks.named('verifyGeoWorldSurfaceBiome')
    dependsOn tasks.named('fingerprintGeoWorldBiomeDecisions')
}
