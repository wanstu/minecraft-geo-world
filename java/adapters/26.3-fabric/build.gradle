tasks.register('verifyGeoWorldClientLayering') {
    group = 'verification'
    description = 'Guards the shared client architecture and rejects duplicated product UI.'
    dependsOn tasks.named('jar')
    doLast {
        def privateWebUi = file('src/main/java/geoworld/fabric/client/GeoWorldGameWebUi.java')
        def privateSettings = file('src/main/java/geoworld/fabric/client/GeoWorldWebUiSettingsScreen.java')
        if (privateWebUi.exists() || privateSettings.exists()) {
            throw new GradleException(
                'GeoWorld WebUI product screens must stay in minecraft-client-common; Fabric may only provide thin loader/API bridges.'
            )
        }
        def jarFile = tasks.named('jar').get().archiveFile.get().asFile
        def zip = new java.util.zip.ZipFile(jarFile)
        try {
            if (zip.getEntry('geoworld/minecraft/client/GeoWorldGameWebUi.class') == null ||
                zip.getEntry('geoworld/minecraft/client/GeoWorldWebUiSettingsScreen.class') == null ||
                zip.getEntry('geoworld/minecraft/client/GeoWorldPresetScreenBase.class') == null ||
                zip.getEntry('geoworld/minecraft/client/GeoWorldCreationSession.class') == null) {
                throw new GradleException('Shared GeoWorld client product classes are missing from the finalized Fabric JAR.')
            }
            if (zip.getEntry('geoworld/fabric/client/GeoWorldGameWebUi.class') != null) {
                throw new GradleException('Fabric-private GeoWorldGameWebUi must not be packaged.')
            }
            if (zip.getEntry('geoworld/minecraft/v26common/client/GeoWorldV26PreviewScreen.class') != null ||
                zip.getEntry('geoworld/minecraft/v26common/client/GeoWorldV26PresetScreen.class') != null ||
                zip.getEntry('geoworld/minecraft/v26common/client/GeoWorldV26CreationSession.class') != null) {
                throw new GradleException('Retired or duplicated GeoWorld client product UI must not be packaged in the active 26.3 build.')
            }
        } finally {
            zip.close()
        }
    }
}
