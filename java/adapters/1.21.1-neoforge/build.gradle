tasks.register('verifyMinecraftCommonIsolation') {
    group = 'verification'
    description = 'Ensures minecraft-common does not depend on one Minecraft version or net.minecraft APIs.'
    inputs.files(fileTree('../../minecraft-common/src/main/java') {
        include '**/*.java'
    })
    doLast {
        def violations = []
        fileTree('../../minecraft-common/src/main/java') {
            include '**/*.java'
        }.each { source ->
            source.eachLine { line, number ->
                if (line =~ /net\.minecraft\./ ||
                    line =~ /geoworld\.minecraft\.v[0-9_]+common/) {
                    violations << "${source}:${number}: ${line.trim()}"
                }
            }
        }
        if (!violations.isEmpty()) {
            throw new GradleException(
                "minecraft-common isolation violations:\n" +
                violations.join('\n')
            )
        }
    }
}

tasks.register('verifyMinecraftV26CommonIsolation') {
    group = 'verification'
    description = 'Ensures minecraft-v26-common stays loader-neutral and independent of 1.21.1/26.2/26.3 thin shells.'
    inputs.files(fileTree('../../minecraft-v26-common/src/main/java') {
        include '**/*.java'
    })
    doLast {
        def violations = []
        fileTree('../../minecraft-v26-common/src/main/java') {
            include '**/*.java'
        }.each { source ->
            source.eachLine { line, number ->
                if (line =~ /net\.neoforged\./ ||
                    line =~ /net\.fabricmc\./ ||
                    line =~ /geoworld\.neoforge\./ ||
                    line =~ /geoworld\.fabric\./ ||
                    line =~ /geoworld\.minecraft\.v26_(?:1_2|2|3)common/) {
                    violations << "${source}:${number}: ${line.trim()}"
                }
            }
        }
        if (!violations.isEmpty()) {
            throw new GradleException(
                "minecraft-v26-common isolation violations:\n" +
                violations.join('\n')
            )
        }
    }
}

tasks.register('verifyMinecraftVersionCommonIsolation') {
    group = 'verification'
    description = 'Ensures the Minecraft 1.21.1 common layer stays independent of Fabric and NeoForge.'
    inputs.files(fileTree('../../minecraft-v1_21_1-common/src/main') {
        include '**/*.java'
    })
    doLast {
        def violations = []
        fileTree('../../minecraft-v1_21_1-common/src/main') {
            include '**/*.java'
        }.each { source ->
            source.eachLine { line, number ->
                if (line =~ /net\.neoforged\./ ||
                    line =~ /net\.fabricmc\./ ||
                    line =~ /geoworld\.neoforge\./ ||
                    line =~ /geoworld\.fabric\./) {
                    violations << "${source}:${number}: ${line.trim()}"
                }
            }
        }
        if (!violations.isEmpty()) {
            throw new GradleException(
                "minecraft-v1_21_1-common loader isolation violations:\n" +
                violations.join('\n')
            )
        }
    }
}

tasks.named('check').configure {
    dependsOn tasks.named('verifyMinecraftCommonIsolation')
    dependsOn tasks.named('verifyMinecraftV26CommonIsolation')
    dependsOn tasks.named('verifyMinecraftVersionCommonIsolation')
    dependsOn tasks.named('verifyGeoWorldChunkPerformanceMode')
    dependsOn tasks.named('verifyGeoWorldBiomePreset')
    dependsOn tasks.named('auditGeoWorldBiomeCoverage')
    dependsOn tasks.named('verifyGeoWorldSurfaceBiomes')
    dependsOn tasks.named('verifyGeoWorldMineralBodies')
    dependsOn tasks.named('verifyGeoWorldMinerals')
    dependsOn tasks.named('verifyGeoWorldSurfaceOutcrops')
    dependsOn tasks.named('fingerprintGeoWorldBiomeDecisions')
    dependsOn tasks.named('verifyGeoWorldDecorationPolicy')
    dependsOn tasks.named('verifyGeoWorldWaterOwnership')
    dependsOn tasks.named('verifyGeoWorldShoreline')
    dependsOn tasks.named('probeGeoWorldReportedCoast')
}
